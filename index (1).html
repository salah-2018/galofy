const DB=()=>new Promise(r=>{const q=indexedDB.open('cms4',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});

const OPEN='<scr'+'ipt id="cms-data" type="application/json">',CLOSE='<'+'/script>';
const fileHTML=()=>{const s={...S};if(!s.rem)s.ghToken='';const im={};used().forEach(id=>im[id]=IMG[id]);
const j=JSON.stringify({v:1,ts:Date.now(),S:s,IMG:im}).replace(/</g,'\\u003c');
const a=SRC0.indexOf(OPEN);if(a<0)throw new Error('لم يُعثر على كتلة البيانات');const b=SRC0.indexOf(CLOSE,a);
return SRC0.slice(0,a+OPEN.length)+j+SRC0.slice(b)};

const idbPut=async(k,v)=>{const d=await DB();return new Promise(r=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>r()})};

const toFile=async ask=>{
if(!window.showSaveFilePicker){if(!ask)return;dl('visual-cms.html',fileHTML(),'text/html');FD=0;fst('⬇ تم تنزيل نسخة محدثة: استبدل بها ملفك القديم');return}
try{if(!FH){if(!ask)return;FH=await showSaveFilePicker({suggestedName:'visual-cms.html',types:[{description:'HTML',accept:{'text/html':['.html']}}]});await idbPut('fh',FH)}
let p=await FH.queryPermission({mode:'readwrite'});if(p!=='granted'){if(!ask)return;p=await FH.requestPermission({mode:'readwrite'})}
if(p!=='granted')return;
const w=await FH.createWritable();await w.write(new Blob([fileHTML()],{type:'text/html'}));await w.close();FD=0;fst('✓ حُفظ في الملف: '+FH.name)}
catch(e){if(e.name!='AbortError')fst('❌ '+e.message)}};

const compress=(f,max)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/webp',.8));URL.revokeObjectURL(i.src)};i.src=URL.createObjectURL(f)});
async function addImgs(files,t){const max=t=='logo'?800:t=='banner'?1400:1000;
for(const f of files){const id=uid();IMG[id]=await compress(f,max);
if(t=='logo'||t=='banner')S[t]=id;else{const a=t=='shots'?S.products[S.cur].shots:S.products[S.cur].imgs;if(a.length<(t=='shots'?12:6))a.push(id)}}
draw();changed()}
const used=()=>{const s=new Set([S.logo,S.banner]);S.products.forEach(p=>{p.imgs.forEach(i=>s.add(i));(p.shots||[]).forEach(i=>s.add(i));(p.revs||[]).forEach(r=>r.i&&s.add(r.i));(p.descHtml||'').replace(/data-id="(\w+)"/g,(m,i)=>{s.add(i);return ''})});s.delete('');return[...s].filter(i=>IMG[i])};

/* ===== النشر على GitHub ===== */
async function gh(path,b64,msg){
const u=`https://api.github.com/repos/${S.ghUser.trim()}/${S.ghRepo.trim()}/contents/${path}`,H={Authorization:'token '+S.ghToken.trim(),'Content-Type':'application/json'};
let sha;const g=await fetch(u+'?t='+Date.now(),{headers:H,cache:'no-store'});if(g.ok)sha=(await g.json()).sha;
const r=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:msg,content:b64,sha})});
if(!r.ok)throw new Error((await r.json()).message||r.status)}
async function publish(){const log=$('#log');
if(!S.ghUser||!S.ghRepo||!S.ghToken){log.textContent='❌ أكمل بيانات GitHub (المستخدم، المستودع، التوكن)';return}
if(!S.sbP&&!confirm('⚠️ هذا المشروع غير مرتبط بالفريق، لذلك لن تصل الطلبات إلى لوحة الطلبات.\nاضغط «إلغاء» لربطه أولًا من زر ☁️ الفريق، أو «موافق» للنشر على أي حال.'))return;
try{const rp=S.ghUser+'/'+S.ghRepo;if(S.upRepo!=rp){S.up=[];S.upRepo=rp}
for(const id of used()){if(S.up.includes(id))continue;log.textContent='⏳ رفع صورة '+id;await gh('images/'+id+'.webp',IMG[id].split(',')[1],'image');S.up.push(id)}
log.textContent='⏳ رفع الصفحة...';await gh('index.html',btoa(unescape(encodeURIComponent(build(true)))),'Update via CMS v4');save();
log.style.color='#059669';log.textContent='🎉 تم النشر! التغييرات تظهر خلال ثوانٍ.'}catch(e){log.style.color='#dc2626';log.textContent='❌ '+e.message}}

<script>
(()=>{
const LS=localStorage,H=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'🆕 جديد',confirmed:'✅ مؤكد',shipped:'🚚 تم الشحن',returned:'↩️ مرتجع',cancelled:'❌ ملغى'};
let ch=null,pid=null,rows=[],mute=LS.getItem('od.mute')==='1',ac=null,nn=0,ov=null,bx=null,flt='all',qs='';
const AC=window.AudioContext||window.webkitAudioContext;
addEventListener('click',()=>{try{ac=ac||new AC();ac.resume()}catch(x){}});
const beep=()=>{if(mute||!AC)return;try{ac=ac||new AC();ac.resume();const t=ac.currentTime;[[988,0],[1319,.12],[1976,.24]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.45);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.5)})}catch(x){}};
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 18px;border-radius:12px;z-index:99999;font-size:14px;font-weight:700';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)};

 const f='project_id=eq.'+pid;ch=sb.channel('o'+pid)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders',filter:f},pl=>{rows.unshift(pl.new);nn++;badge();beep();const r=pl.new;toast('🛒 طلب جديد: '+(r.name||'')+' — '+(r.product||''));try{if(Notification.permission==='granted')new Notification('🛒 طلب جديد',{body:(r.name||'')+' · '+(r.product||'')})}catch(x){}if(ov)render()})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:f},pl=>{const i=rows.findIndex(r=>r.id===pl.new.id);if(i>=0)rows[i]=pl.new;if(ov)render()}).subscribe()};
setInterval(()=>{const C=window.CL;if(!C||!C.sb()||!C.me()||!C.B()){if(pid)stop();return}if(C.B().pid!==pid){stop();pid=C.B().pid;start()}},2000);
setInterval(async()=>{const C=window.CL;if(!pid||!C||!C.sb()||!C.me())return;try{const mx=rows.reduce((m,r)=>Math.max(m,+r.id||0),0),{data}=await C.sb().from('orders').select('*').eq('project_id',pid).gt('id',mx).order('id',{ascending:true});let k=0;(data||[]).forEach(r=>{if(rows.some(x=>x.id===r.id))return;rows.unshift(r);k++;nn++;beep();toast('🛒 طلب جديد: '+(r.name||'')+' — '+(r.product||''))});if(k){badge();if(ov)render()}}catch(x){}},20000);

const render=()=>{const v=vis(),t=v.length?v.map(r=>`<tr${r.status==='new'?' style="background:#fff7ed"':''}><td>${r.id}</td><td>${fmt(r.at)}</td><td>${H(r.product)}</td><td>${H(r.name)}${r.dup?' <span title="طلب مكرر خلال 24 ساعة">🔁</span>':''}</td><td dir=ltr>${H(r.phone||r.email)}</td><td>${H(r.wilaya)}${r.commune?' / '+H(r.commune):''}</td><td>${r.qty||1}</td><td><b>${H(r.total)} ${H(r.cur||'دج')}</b></td><td>${H(r.pay)}</td><td><select data-id="${r.id}">${Object.entries(ST).map(([k,l])=>`<option value="${k}"${r.status===k?' selected':''}>${l}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan=10>لا طلبات</td></tr>';
 bx.innerHTML=`<h3>🛒 الطلبات المباشرة (${rows.length})</h3><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id=oq placeholder="بحث: اسم، هاتف، منتج…" value="${H(qs)}" style="flex:1;min-width:160px"><select id=of><option value=all>كل الحالات</option>${Object.entries(ST).map(([k,l])=>`<option value="${k}"${flt===k?' selected':''}>${l}</option>`).join('')}</select><button data-a=x>⬇ Excel</button><button data-a=m>${mute?'🔕 الصوت مكتوم':'🔔 الصوت يعمل'}</button></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap"><tr style="background:#f3f4f6"><th>#<th>التاريخ<th>المنتج<th>الاسم<th>الاتصال<th>الولاية<th>كمية<th>الإجمالي<th>الدفع<th>الحالة</tr>${t}</table></div>`;
 const q=bx.querySelector('#oq');q.oninput=()=>{qs=q.value.trim().toLowerCase();const p=q.selectionStart;render();const n=bx.querySelector('#oq');n.focus();n.setSelectionRange(p,p)};bx.querySelector('#of').onchange=e=>{flt=e.target.value;render()}};
const xl=()=>{const v=vis().map(r=>({'#':r.id,'التاريخ':fmt(r.at),'الحالة':ST[r.status]||r.status,'المنتج':r.product,'الاسم':r.name,'الهاتف':r.phone,'البريد':r.email,'الولاية':r.wilaya,'البلدية':r.commune,'التوصيل':r.delivery,'الخيار':r.variant,'الكمية':r.qty,'سعر المنتج':r.price,'سعر التوصيل':r.ship,'الإجمالي':r.total,'العملة':r.cur||'دج','الدفع':r.pay,'رقم العملية':r.payid,'ملاحظات':r.note,'عرض إضافي':r.bump,'مكرر':r.dup?'نعم':''}));
 if(window.XLSX){const ws=XLSX.utils.json_to_sheet(v),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Orders');wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,'orders-'+new Date().toISOString().slice(0,10)+'.xlsx')}
 else{const k=Object.keys(v[0]||{}),c='\ufeff'+[k.join(',')].concat(v.map(r=>k.map(x=>'"'+String(r[x]==null?'':r[x]).replace(/"/g,'""')+'"').join(','))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='orders.csv';a.click()}};
const open=()=>{const C=window.CL;if(!C||!C.B()||!C.sb()||!C.me()){toast('اربط المشروع بالفريق أولًا من زر ☁️ الفريق');return}
 try{if(Notification.permission==='default')Notification.requestPermission()}catch(x){}
 nn=0;badge();ov=document.createElement('div');ov.className='cl-ov';bx=document.createElement('div');bx.className='cl-bx';bx.style.width='min(1000px,97vw)';ov.appendChild(bx);document.body.appendChild(ov);
 ov.onclick=e=>{if(e.target===ov){ov.remove();ov=null}};
 bx.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==='x')xl();if(a==='m'){mute=!mute;LS.setItem('od.mute',mute?'1':'0');if(!mute)beep();render()}};
 bx.onchange=async e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;const{error}=await window.CL.sb().from('orders').update({status:e.target.value}).eq('id',id);if(error)toast('⚠️ '+error.message)};
 render()};

})();
