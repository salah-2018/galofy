*{box-sizing:border-box}
body{margin:0;font:15px 'IBM Plex Sans Arabic',system-ui,sans-serif;background:#f5f6fd;color:var(--ink);height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
#top{display:flex;align-items:center;gap:8px;padding:5px 12px;min-height:46px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:nowrap;position:relative;z-index:30}#top>*{flex:none}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto;min-width:0;overflow:hidden;flex:1 1 auto!important}
.brand .lg{display:block;width:112px;height:38px;background:var(--logo) center/contain no-repeat}
.brand b{display:block;font-size:14px}.brand small{display:none}
.chip,#sv{font-size:13px;color:#4a5068}.chip:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:6px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:13px}.seg .on{background:var(--g);color:#fff}
.pub,.exp{border:0;border-radius:10px;padding:7px 16px;font-weight:700;color:#fff}.pub{background:var(--g)}.exp{background:#2150fb}
#app{flex:1;display:grid;grid-template-columns:clamp(150px,15vw,230px) var(--fw,clamp(340px,40vw,540px)) 8px minmax(0,1fr);min-height:0}#pane{min-width:0}#sp{cursor:col-resize;background:var(--bd)}#sp:hover{background:var(--p2)}
#app.e,#app.p{grid-template-columns:clamp(150px,15vw,230px) minmax(0,1fr)}#app.e #pv,#app.e #sp,#app.p #pane,#app.p #sp{display:none}#app.e #pane{max-width:900px;width:100%;margin:0 auto}
#nav{background:#fff;border-left:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#nav small{padding:0 10px 8px;color:#5b6178;font-weight:700}
#nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:12px;border-radius:12px;font-size:15px;color:#4a5068}
#nav i{font-style:normal;font-size:11px;color:#9aa0b8}#nav .on{background:#e9e4ff;color:var(--p);font-weight:700}
#pane{overflow:auto;padding:28px 32px;background:#fff;border-left:1px solid var(--bd)}
.ph{border-bottom:1px solid var(--bd);margin-bottom:20px;padding-bottom:16px}.ph small{color:#2150fb;font-size:12px}.ph h1{font-size:30px;margin:6px 0 4px;font-weight:700}.ph p{margin:0;color:#5b6178;font-size:14px}
.in{display:flex;flex-wrap:wrap;gap:14px}.f{flex:1 1 100%}.f.h{flex:1 1 calc(50% - 7px);min-width:140px}
